name: Sacco Backend SQA CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.flake8'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.flake8'
      - '.github/workflows/backend-ci.yml'

jobs:
  sqa-verification:
    name: Lint, Test & Invariant Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & PEP-8 Static Analysis (flake8)
        run: |
          flake8 app tests --count --statistics

      - name: Execute PyTest Automated Test Suite with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest -v --durations=10
